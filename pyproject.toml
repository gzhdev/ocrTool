[project]
name = "ocr-tool"
version = "0.2.1"
description = "OCRTool —— Windows 桌面本地 OCR 工具（PySide6 + RapidOCR + ONNX Runtime CPU，完全离线）"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pyside6-essentials",
    "onnxruntime",
    "rapidocr",
    "pyinstaller",
    "opencv-python-headless",
    # numpy 2.4 起 win_amd64 wheel 的 SIMD 基线抬到 x86-64-v2，目标客户机 CPU 不支持，
    # import 即崩（源码四处直接 import numpy，此前未声明、版本由第三方解析决定）。
    "numpy<2.4",
]

[project.scripts]
ocrtool = "ocrtool.main:main"

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ocrtool"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# rapidocr 硬依赖 opencv-python（自带 Qt5 插件，与 PySide6 同进程冲突）。
# 覆盖为永假 marker 使其不参与解析，cv2 改由直接依赖的 opencv-python-headless 提供。
override-dependencies = [
    "opencv-python; sys_platform == 'never'",
]
