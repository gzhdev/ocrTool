# GitHub Actions 编译与发布工作流
#
# 触发矩阵（主分支 main 为唯一发布源）：
#   - push main / dev：构建 + ZIP 产物仅上传为流水线 artifact，不发布
#   - push v* 标签：构建后发布到 GitHub Release，但仅当标签提交
#     位于 main 分支上（从 dev 打的标签同样只产出 artifact）
#   - workflow_dispatch：手动触发，仅构建验证
# 链路完全复用仓库脚本：fetch_models.ps1（SHA256 校验）→ build.ps1
# （uv sync --frozen + pytest + PyInstaller + 产物断言）→ release.ps1
# （--self-test 死 proxy 冒烟关卡 + 打包 OCRTool-<version>-win-x64.zip）。
# tag 与程序版本一致性在此强制（spec: packaging 发布包命名与版本一致）。

name: Build & Release

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出仓库（完整历史，用于判断标签是否位于 main）
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 安装 uv 与 Python 3.13
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: 校验标签与程序版本一致
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $initPy = Get-Content "src/ocrtool/__init__.py" -Raw -Encoding UTF8
          if ($initPy -notmatch '__version__\s*=\s*"([^"]+)"') {
            throw "无法解析 __version__"
          }
          $version = $Matches[1]
          $expected = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expected) {
            throw "标签 $env:GITHUB_REF_NAME 与程序版本 $expected 不一致（spec: packaging）"
          }
          Write-Host "标签与版本一致：$expected"

      - name: 获取模型资产（下载 + SHA256 校验）
        shell: pwsh
        run: ./scripts/fetch_models.ps1

      - name: 构建发布目录（依赖同步 + 测试 + PyInstaller + 产物断言）
        shell: pwsh
        run: ./scripts/build.ps1

      - name: 冒烟验收并打包 ZIP
        shell: pwsh
        run: ./scripts/release.ps1 -SkipBuild

      - name: 确认发布资格（标签提交必须位于 main 分支）
        id: release_gate
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -eq 0) {
            "eligible=true" >> $env:GITHUB_OUTPUT
            Write-Host "标签提交位于 main 分支上，允许发布"
          } else {
            "eligible=false" >> $env:GITHUB_OUTPUT
            Write-Host "::warning::标签提交不在 main 分支上，仅产出流水线产物，不发布 Release（主分支 main 为唯一发布源）"
          }

      - name: 上传构建产物
        uses: actions/upload-artifact@v5
        with:
          name: OCRTool-win-x64-${{ github.ref_name }}
          path: dist/OCRTool-*-win-x64.zip
          if-no-files-found: error

      - name: 发布到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/') && steps.release_gate.outputs.eligible == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/OCRTool-*-win-x64.zip
          generate_release_notes: true
          body: |
            OCRTool ${{ github.ref_name }} —— Windows x64 免安装便携版。

            - 解压即用，无需安装 Python 或任何运行环境
            - 完全离线：模型已内置，识别过程零网络请求
            - 冒烟验收（断网环境下中英混合样本识别）已在发布前自动通过
