# GitHub Actions 编译与发布工作流
#
# 触发：推送 v* 标签（发布）或手动 workflow_dispatch（仅构建验证）。
# 链路完全复用仓库脚本：fetch_models.ps1（SHA256 校验）→ build.ps1
# （uv sync --frozen + pytest + PyInstaller + 产物断言）→ release.ps1
# （--self-test 死 proxy 冒烟关卡 + 打包 OCRTool-<version>-win-x64.zip）。
# tag 与程序版本一致性在此强制（spec: packaging 发布包命名与版本一致）。

name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 uv 与 Python 3.13
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      - name: 校验标签与程序版本一致
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $initPy = Get-Content "src/ocrtool/__init__.py" -Raw -Encoding UTF8
          if ($initPy -notmatch '__version__\s*=\s*"([^"]+)"') {
            throw "无法解析 __version__"
          }
          $version = $Matches[1]
          $expected = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expected) {
            throw "标签 $env:GITHUB_REF_NAME 与程序版本 $expected 不一致（spec: packaging）"
          }
          Write-Host "标签与版本一致：$expected"

      - name: 获取模型资产（下载 + SHA256 校验）
        shell: pwsh
        run: ./scripts/fetch_models.ps1

      - name: 构建发布目录（依赖同步 + 测试 + PyInstaller + 产物断言）
        shell: pwsh
        run: ./scripts/build.ps1

      - name: 冒烟验收并打包 ZIP
        shell: pwsh
        run: ./scripts/release.ps1 -SkipBuild

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: OCRTool-win-x64
          path: dist/OCRTool-*-win-x64.zip
          if-no-files-found: error

      - name: 发布到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/OCRTool-*-win-x64.zip
          generate_release_notes: true
          body: |
            OCRTool ${{ github.ref_name }} —— Windows x64 免安装便携版。

            - 解压即用，无需安装 Python 或任何运行环境
            - 完全离线：模型已内置，识别过程零网络请求
            - 冒烟验收（断网环境下中英混合样本识别）已在发布前自动通过
